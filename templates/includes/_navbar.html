{% load static %}
<!-- templates/includes/_navbar.html -->
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
  <div class="container">
    <!-- Logo -->
    <a class="navbar-brand d-flex align-items-center gap-2" href="/">
      <strong>Academy</strong>
    </a>

    <!-- Mobile toggler -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Menu -->
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="/">Bosh sahifa</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/about/">Biz haqimizda</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'course_list' %}active{% endif %}"
             href="{% url 'school:course_list' %}">Kurslar</a>
        </li>

        {% if request.user.is_authenticated %}
          <li class="nav-item">
            <a class="nav-link" href="{% url 'school:course_add' %}">+ Kurs qo'shish</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'logout' %}">Chiqish</a>
          </li>
        {% else %}
          <li class="nav-item">
            <a class="nav-link" href="{% url 'login' %}">Kirish</a>
          </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
